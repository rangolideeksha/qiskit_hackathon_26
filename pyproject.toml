[project]
name = "qiskit-hackathon-26"
version = "0.1.0"
description = "Qiskit walkthrough and practice repo for the NQCC UK Quantum Hackathon 2026 (Warwick)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.30",
    "matplotlib>=3.8",
    "pylatexenc>=2.10",
    "numpy>=1.26",
    "ipykernel>=7.3.0",
    "sympy>=1.14.0",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]
# Quantum chemistry: build molecular Hamiltonians for real catalyst systems.
chem = [
    "qiskit-nature>=0.7",
    "pyscf>=2.6",
]
# Run Qiskit circuits on AWS Braket (emulators, AQT, Alice & Bob).
braket = [
    "qiskit-braket-provider>=0.11",
    "amazon-braket-sdk>=1.90",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qhack"]

[tool.ruff]
line-length = 100
target-version = "py310"
