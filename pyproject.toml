[project]
name = "qiskit-hackathon-26"
version = "0.1.0"
description = "Qiskit walkthrough and practice repo for the NQCC UK Quantum Hackathon 2026 (Warwick)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "qiskit>=2.0",
    "qiskit-aer>=0.17",
    "qiskit-ibm-runtime>=0.30",
    "matplotlib>=3.8",
    "pylatexenc>=2.10",
    "numpy>=1.26",
]

[project.optional-dependencies]
notebooks = [
    "jupyterlab>=4.0",
    "ipykernel>=6.29",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qhack"]

[tool.ruff]
line-length = 100
target-version = "py310"
